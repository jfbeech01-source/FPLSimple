name: Update FPL Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fpl-data.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest FPL data
        run: |
          curl --fail --silent --show-error --location \
            "https://fantasy.premierleague.com/api/bootstrap-static/" \
            -o fpl-raw.json

      - name: Add feed timestamp
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          with open("fpl-raw.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          data["_fetched_at"] = datetime.now(timezone.utc).isoformat()

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))
          PY

      - name: Save updated data
        run: |
          rm -f fpl-raw.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update FPL data"
          git push
